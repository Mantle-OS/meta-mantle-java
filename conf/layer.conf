# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mantle-jave"
BBFILE_PATTERN_meta-mantle-jave = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mantle-jave = "6"

LAYERDEPENDS_meta-mantle-jave = "core"
LAYERSERIES_COMPAT_meta-mantle-jave = "scarthgap"
